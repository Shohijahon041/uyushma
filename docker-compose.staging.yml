name: uyushmachilar-staging

# Ishlatish:
#   node scripts/staging-bootstrap.mjs --domain staging.example.uz
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
#
# Faqat Caddy 80/443 portlarini tashqariga ochadi. Observability portlari
# 127.0.0.1 ga bog'langan (SSH tunnel orqali kiriladi).

x-walg-env: &walg-env
  WALG_S3_PREFIX: s3://${BACKUP_BUCKET}/wal
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_ENDPOINT: http://minio:9000
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile.staging
    container_name: uyushma-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uyushma
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      <<: *walg-env
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
      - -c
      - max_wal_senders=5
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/staging-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uyushma"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  backup:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile.staging
    container_name: uyushma-staging-backup
    restart: unless-stopped
    user: postgres
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION: "7"
      <<: *walg-env
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: uyushma-staging-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio:
    image: minio/minio:latest
    container_name: uyushma-staging-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio-init:
    image: minio/mc:latest
    container_name: uyushma-staging-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc mb --ignore-existing local/${BACKUP_BUCKET} &&
      mc anonymous set none local/${S3_BUCKET} &&
      echo 'buckets ready'
      "
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: uyushma-staging-migrate
    environment:
      DATABASE_URL: postgresql://uyushma_app:${APP_DB_PASSWORD}@postgres:5432/uyushma?schema=public
      MIGRATE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/uyushma?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: uyushma-staging-api
    restart: unless-stopped
    env_file: .env.staging
    environment:
      DATABASE_URL: postgresql://uyushma_app:${APP_DB_PASSWORD}@postgres:5432/uyushma?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_ORIGIN: https://${DOMAIN}
      API_PUBLIC_URL: https://${DOMAIN}
      S3_ENDPOINT: http://minio:9000
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      ENABLE_SWAGGER: "false"
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN}
      NOTIFICATIONS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: uyushma-staging-worker
    restart: unless-stopped
    env_file: .env.staging
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_API_URL: http://api:4000
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [backend]

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: uyushma-staging-bot
    restart: unless-stopped
    env_file: .env.staging
    environment:
      BOT_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: uyushma-staging-web
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2.8-alpine
    container_name: uyushma-staging-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: uyushma-staging-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.staging/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  loki:
    image: grafana/loki:3.1.1
    container_name: uyushma-staging-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [backend]

  promtail:
    image: grafana/promtail:3.1.1
    container_name: uyushma-staging-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks: [backend]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: uyushma-staging-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  miniodata:
  prometheusdata:
  lokidata:
  grafanadata:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
