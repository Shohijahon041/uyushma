[databases]
uyushma = host=timescaledb port=5432 dbname=uyushma auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; 100,000 ta faol transport uchun tranzaksiya darajasidagi pooling (Transaction Pooling Mode)
pool_mode = transaction

; Mijoz ulanishlari limitlari
max_client_conn = 100000
default_pool_size = 50
min_pool_size = 20
reserve_pool_size = 15
reserve_pool_timeout = 5
max_db_connections = 150

; Timeoutlar (Soket qotib qolishi va resurs oqib ketishining oldini olish)
server_idle_timeout = 60
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 120
client_login_timeout = 60
autocommit = 1
query_timeout = 30
stats_period = 60
ignore_startup_parameters = extra_float_digits,search_path
