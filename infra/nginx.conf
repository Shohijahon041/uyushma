# =============================================================================
# UYUSHMA GPS & FLEET SAAS - NGINX TCP STREAM & HTTP LOAD BALANCER
# =============================================================================
# 100,000 bir vaqtdagi ulanishlar uchun Nginx konfiguratsiyasi
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 200000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

# -----------------------------------------------------------------------------
# 1. TCP STREAM LOAD BALANCER (H02 GPS Gateway - Port 20335)
# -----------------------------------------------------------------------------
stream {
    upstream h02_tcp_cluster {
        least_conn;
        server h02_gateway_1:20335 max_fails=3 fail_timeout=10s;
        server h02_gateway_2:20335 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 20335 so_keepalive=on;
        proxy_pass h02_tcp_cluster;
        
        # TCP ulanish timeoutlari
        proxy_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_buffer_size 16k;
    }
}

# -----------------------------------------------------------------------------
# 2. HTTP & WEBSOCKET REVERSE PROXY (FastAPI va Dispetcher Paneli)
# -----------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip siqish
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream api_cluster {
        server api_server:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Dispetcher xaritasi statik fayllari
        location / {
            root /usr/share/nginx/html;
            index dispatcher_map.html index.html;
            try_files $uri $uri/ /dispatcher_map.html;
        }

        # FastAPI REST API so'rovlari
        location /api/ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Dispetcher Real-Time WebSocket
        location /api/v1/ws/ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Salomatlik tekshiruvi
        location /health {
            proxy_pass http://api_cluster/health;
        }
    }
}

