global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: staging
    stack: uyushmachilar

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: uyushma-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:4000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
