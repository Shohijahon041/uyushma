name: uyushma_mobile_app
description: "Uyushma GPS & Fleet Management Mobile App for Drivers"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fon servisi va GPS treking (Foreground Service)
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # HTTP va Mahalliy saqlash (Offline GPS Queue)
  http: ^1.2.1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Qo'ng'iroq va havolalarni ochish (tel:, Click, Payme)
  url_launcher: ^6.3.0

  # Google Analytics 4 (Firebase Analytics)
  firebase_core: ^3.1.0
  firebase_analytics: ^11.0.1

  # Formatlash va UI yordamchilari
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  crypto: ^3.0.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/


